name: Deploy main to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm run build
        env:
          GITHUB_PAGES_BASE_PATH: /zombi-stalker

      - name: Normalize static asset paths
        run: cp -R "dist/client${GITHUB_PAGES_BASE_PATH}/_next" dist/client/_next
        env:
          GITHUB_PAGES_BASE_PATH: /zombi-stalker

      - name: Disable Jekyll processing
        run: touch dist/client/.nojekyll

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist/client
          clean-exclude: pr-preview
          force: false
