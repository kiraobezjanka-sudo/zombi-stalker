name: Deploy Pull Request preview

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  contents: write
  pull-requests: write
  issues: write
  pages: write

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        if: github.event.action != 'closed'
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build static preview
        if: github.event.action != 'closed'
        run: pnpm run build
        env:
          GITHUB_PAGES_BASE_PATH: /zombi-stalker/pr-preview/pr-${{ github.event.number }}

      - name: Normalize static asset paths
        if: github.event.action != 'closed'
        run: cp -R "dist/client${GITHUB_PAGES_BASE_PATH}/_next" dist/client/_next
        env:
          GITHUB_PAGES_BASE_PATH: /zombi-stalker/pr-preview/pr-${{ github.event.number }}

      - name: Disable Jekyll processing
        if: github.event.action != 'closed'
        run: touch dist/client/.nojekyll

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: dist/client
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          wait-for-pages-deployment: false
          qr-code: false

      - name: Request GitHub Pages build
        run: |
          curl --fail-with-body --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
        env:
          GITHUB_TOKEN: ${{ github.token }}
